name: E2E (日次)

# 段階1: データ収集のみ。ジョブは常に緑にする(失敗も含めて exit 0)。
#
# 理由: E2Eはこのアプリの性質上フレーキー(tests/e2e/README.md参照)で、
# CI環境は手元より遅く、既知フレーキー一覧も手元の実測(#128以前)を
# もとにしたもの。CI固有の落ち方がどれだけあるか分かっていない段階で
# 赤くすると、毎朝の通知がノイズになり「調べなくていい」と学習される
# ほうが害が大きい。まずは実行結果を積み上げてから、一覧の見直しや
# マージ後トリガー(門番)の追加を検討する。
#
# 実行結果そのものは握り潰さない。$GITHUB_STEP_SUMMARY に必ず書く。
#
# tests/e2e/conftest.pyが書く実行履歴(.e2e-runs/*.json)はartifactとして
# 上げる。手元では scripts/e2e_history.py fetch-ci が gh run download 経由で
# 取り込む(#128)。
#
# public リポジトリの schedule トリガーは60日間リポジトリの更新が無いと
# 自動停止する。今のところ実害は無いはずだが、動いていないと気づいたら
# これを疑うこと。
#
# Firefox と Chromium の両方を、**同一ジョブで逐次**実行する(matrixで2ジョブに
# 分けない)。理由は2つ:
#   - .e2e-runs/*.json を1つのartifactにまとめて上げられる。matrixにすると
#     artifact名をジョブごとに変える必要があり(actions/upload-artifactは
#     同名artifactの重複を許さない)、fetch-ci が探す名前(e2e-history)と
#     食い違って取り込めなくなる
#   - run(1回のスイート実行)はブラウザ・シード・実行順を1組として意味を持つ。
#     ジョブを分けても行儀は変わらないが、逐次のほうがログを1本で追える
#
# E2E_KNOWN_FLAKY はブラウザ別(tests/e2e/conftest.py)。既知フレーキーの扱いが
# ブラウザごとに独立しているのは意図どおりで、和集合にすると「載っていないテストが
# 落ちたら本物」という対比が両方のブラウザで鈍る。

on:
  schedule:
    # 3:00 JST = 18:00 UTC(前日)
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E日次実行(失敗してもジョブは赤くしない)
    runs-on: ubuntu-latest
    # 2ブラウザぶん(手元実測: Firefoxのフルスイート約13分、Chromium約9分)。
    # CIはホストより遅いので、単純な合計より余裕を見る。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # webpackのビルドに要る(scripts/build_image.shが呼ぶ)。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # requirements*.txt の書き出しに要る(uv export)。
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # mongoの起動・イメージのビルド・docker runでの実行は、すべて
      # scripts/run_e2e.sh (経由の scripts/lib/container_tests.sh) が
      # 面倒を見る。ローカル実行と同じ経路をそのまま使う。
      #
      # `run:` のシェルは既定で `-e` が効くので、pytestが非0で終わっても
      # ステップ自体は失敗させたい……が、このジョブは失敗させたくないので
      # 自前で `set +e` して終了コードを拾う。
      #
      # 1回目(Firefox)がイメージをビルドし、2回目(Chromium)は --no-build で
      # それを使い回す。Chromiumはイメージ内に既に同居している(Dockerfile.e2e)ので、
      # ブラウザを切り替えるためだけの再ビルドは要らない。
      - name: E2Eを実行する(Firefox)
        id: e2e_firefox
        env:
          # 既定はlocal(scripts/lib/container_tests.sh)。CIから来た実行だと
          # 分かるようにする。実行履歴(.e2e-runs/*.json)のrun.originに残る。
          ASOBANN_E2E_RUN_ORIGIN: ci
        run: |
          set +e
          ./scripts/run_e2e.sh --tolerate-flaky
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: E2Eを実行する(Chromium)
        id: e2e_chrome
        env:
          ASOBANN_E2E_RUN_ORIGIN: ci
          ASOBANN_E2E_BROWSER: chrome
        run: |
          set +e
          ./scripts/run_e2e.sh --no-build --tolerate-flaky
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 結果をサマリーに書く
        if: always()
        run: |
          write_line() {
            local label="$1" code="$2"
            if [ "$code" = "0" ]; then
              echo "✅ E2E成功($label、既知フレーキーの扱いも含む)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ E2E失敗($label、終了コード $code)。一覧に無いテストが落ちた可能性がある。ログを確認すること" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          write_line "Firefox" "${{ steps.e2e_firefox.outputs.exit_code }}"
          write_line "Chromium" "${{ steps.e2e_chrome.outputs.exit_code }}"

      # E2Eの実行そのものが失敗しても(mongo起動やビルドで死んだ場合を除き)pytestは
      # 最後まで走ってJSONを書く。always() で、失敗時ほど見たい記録を確実に残す。
      #
      # include-hidden-files が既定でfalseだと、.e2e-runs/自体がドット始まりの
      # ディレクトリなので中身ごと除外される(actions/upload-artifact@v4の仕様)。
      # 実際にこれが原因で最初の実行では"No files were found"になった。
      - name: 実行履歴をartifactに上げる
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-history
          path: .e2e-runs/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
